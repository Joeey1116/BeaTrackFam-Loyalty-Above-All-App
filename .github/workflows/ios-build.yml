name: Build iOS IPA

# Manual-only trigger: builds never fire on their own, so the free macOS
# minutes are only spent when someone clicks "Run workflow" in the Actions tab.
on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Upload the IPA to App Store Connect (TestFlight) after building'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-ipa:
    name: Archive BeaTrackFam (Release)
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Read app version from app.json
        run: |
          echo "APP_VERSION=$(jq -r '.expo.version' app.json)" >> "$GITHUB_ENV"
          echo "APP_BUILD=$(jq -r '.expo.ios.buildNumber' app.json)" >> "$GITHUB_ENV"

      - name: Select the newest Xcode on the runner
        # Newest is deliberate (Joey's call, Oct 5): the app stays on latest
        # everything. Expo SDK 57's expo-modules-jsi fails to compile under
        # Xcode 26.2/26.3 (clang rejects the SWIFT_RETURNS_RETAINED
        # annotations on the RuntimeScheduler constructors) but compiles
        # clean under Xcode 26.6 on the macos-26 image. If a future run
        # still errors there, the fallback is a patch-package drop of those
        # two annotations — not an older Xcode: since Apr 28, 2026 App
        # Store Connect uploads require Xcode 26 / iOS 26 SDK.
        run: |
          XC="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XC" ]; then XC="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"; fi
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install JS dependencies
        run: npm ci
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Generate the native iOS project (expo prebuild)
        # app.json is the source of truth for version/build number; prebuild
        # stamps them into Info.plist on every run.
        run: npx expo prebuild -p ios --no-install
        env:
          CI: 'true'
          EXPO_NO_TELEMETRY: '1'

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Verify the App Clip target exists (plugins/with-app-clip)
        # The clip target is generated by the with-app-clip config plugin
        # during prebuild. Fail fast here — not at archive time — if the
        # plugin did not add it. Clip bundle ID (App ID "BeaTrackFam App
        # Clip", already in the Developer portal): com.beatrackfaminc.BeaTrackFam
        # Signing is automatic (-allowProvisioningUpdates): the workflow
        # references NO provisioning profile by name. The clip profile is
        # created/managed by Xcode on first build from the existing App ID;
        # it must include the current (Nov 6) Apple Distribution certificate.
        # If the archive later fails on clip signing, check the Profiles tab
        # in the Developer portal for com.beatrackfaminc.BeaTrackFam first.
        run: |
          node -e "
          const xcode = require('xcode');
          const fs = require('fs');
          const p = xcode.project('ios/BeaTrackFam.xcodeproj/project.pbxproj');
          p.parseSync();
          const o = p.hash.project.objects;
          const fail = (m) => { console.error('::error::App Clip check failed: ' + m); process.exit(1); };
          const clip = Object.entries(o.PBXNativeTarget || {}).find(([k, v]) => v && String(v.name).includes('BeaTrackFamClip'));
          if (!clip) fail('no BeaTrackFamClip target in project.pbxproj — the with-app-clip plugin did not run');
          if (clip[1].productType !== '\"com.apple.product-type.application.on-demand-install-capable\"') fail('clip target is not an App Clip product type: ' + clip[1].productType);
          const list = o.XCConfigurationList[clip[1].buildConfigurationList];
          for (const c of list.buildConfigurations) {
            const s = o.XCBuildConfiguration[c.value].buildSettings;
            if (s.PRODUCT_BUNDLE_IDENTIFIER !== '\"com.beatrackfaminc.BeaTrackFam\"') fail('clip ' + c.comment + ' bundle ID is ' + s.PRODUCT_BUNDLE_IDENTIFIER + ', expected com.beatrackfaminc.BeaTrackFam');
          }
          const main = Object.entries(o.PBXNativeTarget).find(([k, v]) => v && String(v.name) === 'BeaTrackFam');
          if (!main || !main[1].dependencies || main[1].dependencies.length !== 1) fail('main target does not depend on the clip target');
          const ent = fs.readFileSync('ios/BeaTrackFam/BeaTrackFam.entitlements', 'utf8');
          if (!ent.includes('com.beatrackfaminc.BeaTrackFam')) fail('parent entitlements do not list the clip bundle ID');
          console.log('App Clip target OK: BeaTrackFamClip / com.beatrackfaminc.BeaTrackFam, embedded in BeaTrackFam.');
          "

      - name: Write the App Store Connect API key
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          KEY_FILE="$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          mkdir -p "$HOME/private_keys"
          raw="$ASC_API_KEY_P8"
          # Undo common paste accidents: surrounding quotes, CR characters,
          # and literal \n sequences instead of real line breaks.
          raw="${raw#\"}"; raw="${raw%\"}"
          raw="${raw#\'}"; raw="${raw%\'}"
          raw="$(printf '%s' "$raw" | tr -d '\r')"
          if [[ "$raw" != *$'\n'* ]]; then
            raw="$(printf '%s' "$raw" | sed 's/\\n/\n/g')"
          fi
          # If the BEGIN/END lines were lost, wrap the base64 body again.
          if [[ "$raw" != *"BEGIN PRIVATE KEY"* ]]; then
            body="$(printf '%s' "$raw" | tr -d '[:space:]')"
            raw="$(printf -- '-----BEGIN PRIVATE KEY-----\n%s\n-----END PRIVATE KEY-----\n' "$(printf '%s' "$body" | fold -w 64)")"
          fi
          printf '%s\n' "$raw" > "$KEY_FILE"
          if ! openssl pkey -in "$KEY_FILE" -noout 2>/dev/null; then
            echo "::error::The ASC_API_KEY_P8 secret is not a valid .p8 key. Re-paste the full contents of the .p8 file from App Store Connect, including the BEGIN/END lines."
            exit 1
          fi

      - name: Archive the app (automatic signing via API key)
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -workspace ios/BeaTrackFam.xcworkspace \
            -scheme BeaTrackFam \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$GITHUB_WORKSPACE/build/BeaTrackFam.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic

      - name: Verify the App Clip is inside the archive
        # The clip ships embedded in the parent app bundle. If this fails,
        # the IPA went out without the clip even though the build succeeded.
        run: |
          CLIP_PLIST="$GITHUB_WORKSPACE/build/BeaTrackFam.xcarchive/Products/Applications/BeaTrackFam.app/AppClips/BeaTrackFamClip.app/Info.plist"
          if [ ! -f "$CLIP_PLIST" ]; then
            echo "::error::BeaTrackFamClip.app is missing from the archive (expected under BeaTrackFam.app/AppClips/). The Embed App Clips phase did not run."
            exit 1
          fi
          CLIP_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$CLIP_PLIST")"
          if [ "$CLIP_ID" != "com.beatrackfaminc.BeaTrackFam" ]; then
            echo "::error::Archived clip bundle ID is $CLIP_ID, expected com.beatrackfaminc.BeaTrackFam."
            exit 1
          fi
          echo "Archive contains App Clip: BeaTrackFamClip.app ($CLIP_ID)"

      - name: Export the IPA
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$GITHUB_WORKSPACE/build/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$GITHUB_WORKSPACE/build/BeaTrackFam.xcarchive" \
            -exportPath "$GITHUB_WORKSPACE/build/ipa" \
            -exportOptionsPlist "$GITHUB_WORKSPACE/build/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID"

      - name: Upload the IPA as a run artifact
        uses: actions/upload-artifact@v6
        with:
          name: BeaTrackFam-${{ env.APP_VERSION }}-${{ env.APP_BUILD }}-ipa
          path: build/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload the build to App Store Connect (TestFlight)
        if: inputs.upload_to_testflight
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          IPA="$(ls "$GITHUB_WORKSPACE"/build/ipa/*.ipa | head -1)"
          echo "Uploading $IPA to App Store Connect..."
          # altool looks for AuthKey_<id>.p8 in ~/.appstoreconnect/private_keys
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8" "$HOME/.appstoreconnect/private_keys/"
          ok=""
          for attempt in 1 2 3; do
            echo "Upload attempt $attempt of 3..."
            if xcrun altool --upload-app --type ios --file "$IPA" \
                 --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID"; then
              ok=1; break
            fi
            sleep 20
          done
          if [ -z "$ok" ]; then
            echo "::error::TestFlight upload failed after 3 attempts. The IPA is still saved as a run artifact above — upload that file in Transporter instead."
            exit 1
          fi
          echo "Uploaded. Apple processes the build (usually ~5-30 min), then it appears in TestFlight."

      - name: Remove the API key
        if: always()
        run: rm -rf "$HOME/private_keys"
